cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{height:210px;border:0;border-radius:9px;overflow:hidden;position:relative;color:#fff;text-align:left}.card.purple{background:linear-gradient(145deg,#7057db,#312d77)}.card.orange{background:linear-gradient(145deg,#c08a50,#772d3d)}.card.green{background:linear-gradient(145deg,#1da06c,#15514f)}.card.blue{background:linear-gradient(145deg,#2d79ad,#22264f)}.card em{position:absolute;top:8px;left:10px;font-size:8px}.art{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) rotate(-8deg);font-size:88px;text-shadow:0 15px 30px #0008}.name{position:absolute;bottom:0;left:0;right:0;height:70px;padding:28px 10px 8px;background:linear-gradient(transparent,#080a12)}.name strong{display:block;font-family:Impact;font-size:21px}.name span{font-size:8px}.stage{display:none;height:calc(100dvh - 64px)}.stage.open{display:flex;flex-direction:column}.stagehead{height:54px;padding:8px 20px;display:flex;align-items:center}.stagehead button{height:38px;border:1px solid #ffffff12;border-radius:8px;background:#171b29;color:#fff}.host{margin:auto;height:42px;min-width:200px;border:1px solid #ffffff12;border-radius:24px;padding:3px 12px 3px 3px;display:flex;align-items:center;gap:8px;font-size:10px}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#cba09e,#60366e)}canvas{width:calc(100% - 40px)!important;height:calc(100dvh - 224px)!important;min-height:360px;margin:0 20px;border:1px solid #ffffff12;border-radius:16px;background:#080a12}.controls{height:106px;padding:8px 20px}.bets{height:48px;display:grid;grid-template-columns:52px 52px 52px 1fr;gap:8px}.bets button,.bets strong{border:1px solid #ffffff12;border-radius:10px;background:#171b29;color:#ddd}.bets strong{display:grid;place-items:center;color:#fff}.primary{width:100%;height:48px;margin-top:7px;border:0;border-radius:10px;background:linear-gradient(135deg,#25d59e,#159f78);color:#06120e;font-weight:900}.modal{position:fixed;z-index:10;inset:0;display:none;place-items:center;background:#05060bbd}.modal.open{display:grid}.box{width:330px;text-align:center;border:1px solid #ffffff18;border-radius:20px;padding:25px;background:#15182a}.coin{width:70px;height:70px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#d0ad56;font-size:38px}.box p{color:#aaa}.box button{margin-top:8px}@media(max-width:700px){.topnav{display:none}.hero{height:210px;margin:12px}.hero h1{font-size:34px}.hero{padding:18px}.promo,.dealer{display:none}.rail{padding:10px 12px}.cards{display:flex;overflow-x:auto}.card{min-width:145px;height:190px}.stagehead{padding:7px 10px}.stagehead .host{max-width:190px}.controls{padding:8px 10px}.bets{grid-template-columns:48px 48px 48px 1fr}canvas{width:calc(100% - 20px)!important;margin:0 10px}}

  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"}}</script>

<body>
  <div class="app">
    <header class="top"><div class="logo">NEON<i>◆</i></div><nav class="topnav"><button class="active">⌂ Home</button><button>◉ Casino</button><button>$ Free money</button></nav><div class="profile"><button class="coins">2500 COINS</button><button class="plus" id="deposit">+</button></div></header>
    <section id="lobby">
      <section class="hero"><div><small>TONIGHT'S EVENT</small><h1>FREE BETS ON<br/>NEON MAJOR 2026</h1><button>Learn more</button></div><div class="dealer"><div class="head"></div><div class="body">V</div></div><aside class="promo"><b>FREE MONEY</b><div></div></aside></section>
      <section class="rail"><h2>♢ 1WIN GAMES</h2><div class="cards">
        <button class="card purple" data-game="crash"><em>1WIN GAMES</em><div class="art">🚀</div><div class="name"><strong>LUCKY JET</strong><span>● 2.7K playing</span></div></button>
        <button class="card orange" data-game="roulette"><em>LIVE TABLE</em><div class="art">●</div><div class="name"><strong>ROULETTE</strong><span>● 1.8K playing</span></div></button>
        <button class="card green" data-game="plinko"><em>1WIN GAMES</em><div class="art">◆</div><div class="name"><strong>CRYPTOMINES</strong><span>● 3.1K playing</span></div></button>
        <button class="card blue" data-game="slots"><em>TADA GAMING</em><div class="art">♠</div><div class="name"><strong>BLACKJACK</strong><span>● 920 playing</span></div></button>
      </div></section>
    </section>
    <section class="stage" id="stage"><div class="stagehead"><button id="back">‹ Lobby</button><div class="host"><div class="avatar">V</div><span id="message">Стол готов</span></div></div><canvas id="canvas"></canvas><div class="controls"><div class="bets"><button data-bet="half">½</button><button data-bet="double">×2</button><button data-bet="max">MAX</button><strong id="bet">50 COINS</strong></div><button class="primary" id="play">START FLIGHT</button></div></section>
  </div>
  <div class="modal" id="modal"><div class="box"><div class="coin">$</div><h2>Пополнение скоро</h2><p>Демо-режим на виртуальных монетах.</p><button class="primary" id="buy">Получить 5 000 монет</button></div></div>

<script type="module">
import * as THREE from 'three';
let balance=2500,bet=50,game='crash',running=false,spinning=false;
const lobby=document.querySelector('#lobby'),stage=document.querySelector('#stage'),canvas=document.querySelector('#canvas'),ctx=document.querySelector('.coins'),message=document.querySelector('#message'),play=document.querySelector('#play');

const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setClearColor(0x080a12);
const scene=new THREE.Scene();scene.fog=new THREE.Fog(0x080a12,7,13);const camera=new THREE.PerspectiveCamera(42,1,.1,100);camera.position.set(0,.5,7);scene.add(new THREE.AmbientLight(0xffffff,.9));
const light=new THREE.PointLight(0x7768ff,35,12);light.position.set(4,5,4);scene.add(light);const green=new THREE.PointLight(0x20d79a,24,10);green.position.set(-4,-2,3);scene.add(green);
let objects=[],rocket,ring,roulette,ball,slot;

function clearScene(){objects.forEach(o=>scene.remove(o));objects=[]}
function add(o){scene.add(o);objects.push(o);return o}
function createJet(){clearScene();rocket=add(new THREE.Group());rocket.position.y=-1.2;const body=new THREE.Mesh(new THREE.ConeGeometry(.38,1.3,32),new THREE.MeshStandardMaterial({color:0xeef1ff,metalness:.8,roughness:.15}));body.rotation.z=-Math.PI/2;rocket.add(body);const glow=new THREE.Mesh(new THREE.SphereGeometry(.24,24,16),new THREE.MeshStandardMaterial({color:0x59d8ff,emissive:0x168bd9,emissiveIntensity:2}));glow.position.set(.05,-.48,0);rocket.add(glow);ring=new THREE.Mesh(new THREE.TorusGeometry(.85,.018,8,48),new THREE.MeshBasicMaterial({color:0x24d5ad,transparent:true,opacity:.45}));ring.position.y=-1.9;add(ring)}
function createRoulette(){clearScene();roulette=add(new THREE.Mesh(new THREE.CylinderGeometry(2.25,2.25,.28,64),new THREE.MeshStandardMaterial({color:0x171a2a,metalness:.78,roughness:.2})));roulette.rotation.x=.42;for(let i=0;i<37;i++){let a=i/37*Math.PI*2,m=new THREE.Mesh(new THREE.BoxGeometry(.28,.16,.28),new THREE.MeshStandardMaterial({color:i===0?0x23b77f:i%2?0xcf335e:0x252b43}));m.position.set(Math.cos(a)*1.72,-.05,Math.sin(a)*1.72);m.rotation.y=-a;add(m)}ball=add(new THREE.Mesh(new THREE.SphereGeometry(.09,18,18),new THREE.MeshStandardMaterial({color:0xffffff,metalness:1,roughness:.08,emissive:0xcfd6ff,emissiveIntensity:.5})))}
function createPlinko(){clearScene();for(let row=0;row<8;row++)for(let col=0;col<=row;col++){let p=new THREE.Mesh(new THREE.SphereGeometry(.055,12,12),new THREE.MeshStandardMaterial({color:0x73f7d2,emissive:0x20e3a2,emissiveIntensity:1.8}));p.position.set(col-row/2,1.55-row*.38,0);add(p)}for(let i=0;i<9;i++){let s=new THREE.Mesh(new THREE.BoxGeometry(.65,.34,.12),new THREE.MeshStandardMaterial({color:0x24233a,emissive:0x52cdb2,emissiveIntensity:.15}));s.position.set(i-4,-1.58,.02);add(s)}ball=add(new THREE.Mesh(new THREE.SphereGeometry(.13,24,24),new THREE.MeshStandardMaterial({color:0xd9ffef,emissive:0x20e3a2,emissiveIntensity:2})));ball.position.y=2.2}
function createSlots(){clearScene();slot=add(new THREE.Group());let box=new THREE.Mesh(new THREE.BoxGeometry(5.2,3.35,.75),new THREE.MeshStandardMaterial({color:0x171424,metalness:.55,roughness:.22}));slot.add(box);for(let i=-1;i<=1;i++){let r=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,.55,32),new THREE.MeshStandardMaterial({color:0x28233e,emissive:0x9b5cff,emissiveIntensity:.22}));r.position.set(i*1.48,.05,.48);slot.add(r)}add(slot)}

function openGame(next){game=next;haptic();lobby.style.display='none';stage.classList.add('open');message.textContent={crash:'Lucky Jet готов',roulette:'Европейская рулетка',plinko:'Падающий шар',slots:'Кибер-слоты'}[game];running=false;spinning=false;if(game==='crash'){createJet();play.textContent='START FLIGHT'}if(game==='roulette'){createRoulette();play.textContent='SPIN ROULETTE'}if(game==='plinko'){createPlinko();play.textContent='DROP BALL'}if(game==='slots'){createSlots();play.textContent='SPIN REELS'}}
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>openGame(b.dataset.game));document.querySelector('#back').onclick=()=>{lobby.style.display='block';stage.classList.remove('open')};

let betValue=50;document.querySelectorAll('[data-bet]').forEach(b=>b.onclick=()=>{haptic();if(b.dataset.bet==='half')betValue=Math.max(1,Math.floor(betValue/2));if(b.dataset.bet==='double')betValue=Math.min(balance,betValue*2);if(b.dataset.bet==='max')betValue=balance;document.querySelector('#bet').textContent=betValue+' COINS'});
function haptic(){try{window.Telegram?.WebApp?.HapticFeedback?.impactOccurred('light')}catch(e){}}
function wait(ms=700){return new Promise(r=>setTimeout(r,ms))}
play.onclick=async()=>{haptic();if(betValue>balance)return message.textContent='Недостаточно монет';balance-=betValue;ctx.textContent=balance+' COINS';if(game==='crash'){running=true;let target=+(1.2+Math.random()*5).toFixed(2),start=performance.now();play.textContent='CASHOUT';await wait(220);running=false;message.textContent='Раунд завершён: x'+target}else if(game==='roulette'){spinning=true;play.textContent='SPINNING…';await wait(1700);createRoulette();spinning=false;let pocket=Math.floor(Math.random()*37),win=Math.random()<.486;if(win){balance+=betValue*2;ctx.textContent=balance+' COINS'}message.textContent='Выпало '+pocket+(win?' · выигрыш':'');play.textContent='SPIN ROULETTE'}else if(game==='plinko'){if(ball){ball.position.set(0,2.2,0)}await wait(1400);let multi=[8,3,1.5,.5,.3,.5,1.5,3,8][Math.floor(Math.random()*9)],win=Math.floor(betValue*multi);balance+=win;ctx.textContent=balance+' COINS';message.textContent='Лунка x'+multi+' · +'+win}else if(game==='slots'){spinning=true;play.textContent='SPINNING…';await wait(1400);spinning=false;let win=Math.random()<.22;if(win){let payout=betValue*5;balance+=payout;ctx.textContent=balance+' COINS'}message.textContent=win?'Комбинация собрана!':'Почти идеально';play.textContent='SPIN REELS'}};

document.querySelector('#deposit').onclick=()=>document.querySelector('#modal').classList.add('open');document.querySelector('#buy').onclick=()=>{balance+=5000;ctx.textContent=balance+' COINS';document.querySelector('#modal').classList.remove('open')};

function resize(){const r=canvas.getBoundingClientRect();renderer.setSize(r.width,r.height,false);camera.aspect=r.width/r.height;camera.updateProjectionMatrix()}window.addEventListener('resize',resize);resize();createJet();
let t=0;function animate(){requestAnimationFrame(animate);t+=.016;if(running&&rocket){rocket.position.y+=.008;if(ring){ring.rotation.z=t*.5}}if(spinning&&roulette)roulette.rotation.z-=.04;if(spinning&&slot)slot.rotation.z=Math.sin(t*8)*.03;if(ball&&game==='plinko'&&!spinning){ball.position.x=Math.sin(t*4)*.08}renderer.render(scene,camera)}animate();
</script>
</body>
